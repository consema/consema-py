# Consema Python implementation.
# Authority: https://github.com/consema/consema/blob/main/docs/multi-language-implementation-plan.md §0.2 (python/ = single
# package `consema`, zero third-party runtime dependencies, pytest for tests).
#
# Build backend choice: hatchling. Justification: the package is pure-Python
# with a src/ layout and no build steps, which is exactly the configuration
# hatchling supports with a single declarative [build-system]+[project] pair
# (no setup.py/setup.cfg, no legacy shims); setuptools would work but needs
# more configuration for the same result. The backend is a build-time-only
# requirement and does not affect the zero-runtime-dependency policy
# (go.mod zero-require precedent, plan §0.2).
[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "consema"
version = "1.0.0-rc.1"
description = "Language-neutral Consema contracts: closed fifteen-kind PortableValue, PortableGraph, PVCE/1 and PGCE/1 codecs, protocol registries (L0-L5 closed)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["consema", "configuration", "language-neutral", "portable-value"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/consema/consema-py"
Repository = "https://github.com/consema/consema-py"

[project.optional-dependencies]
# Pinned exactly (G70, 2026-08-14): the dev extra is the whole dependency
# surface (zero runtime dependencies). The repository keeps no lockfile, so
# only these two direct pins are reproducible — the transitive tree floats
# with pip resolution at install time (a lockfile is a post-1.0.0 backlog
# item; wave-4 R17).
dev = ["pytest==9.1.1", "pytest-cov==7.1.0"]

# G95 (2026-08-14): the MIT LICENSE text must ship in both the sdist and
# the wheel. The file lives inside the project root (python/LICENSE, kept
# byte-identical to the repository-root LICENSE — enforced by the
# check-version-consistency CI job) so hatchling resolves it with no path
# escaping the project root. A "../LICENSE" force-include broke the
# wheel-from-sdist build, because force-include paths resolve relative to
# the extracted sdist root (python -m build P0, fixed 2026-08-14). PEP 639
# license-files covers both artifacts (sdist root + wheel
# dist-info/licenses/LICENSE, asserted by the release.yml artifact check).
[tool.hatch.metadata]
license-files = { paths = ["LICENSE"] }

[tool.hatch.build.targets.wheel]
packages = ["src/consema"]

# Wave-4 GW4-18 (2026-08-15): the sdist ships only the package tree plus
# the metadata files hatchling always includes (pyproject.toml, the README,
# the license-files set, and the VCS exclusion files — hatchling
# force-includes .gitignore by design, so a .gitignore in the sdist is
# expected, not a leak). Without an explicit include, hatchling packed the
# whole project directory — tests/, examples/ and local .coverage files
# leaked into the sdist (the release.yml artifact check now asserts their
# absence).
[tool.hatch.build.targets.sdist]
include = ["src/consema/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
