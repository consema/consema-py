# Consema Python CI (https://github.com/consema/consema/blob/main/docs/five-language-ci-design.md §1.2, §7.1): the
# Python implementation joins the release gate with nine explicit jobs
# (python-gates / python-conformance / python-differential / coverage /
# check-version-consistency / examples / python-package / pip-audit + the
# aggregate check; the design rejects a single shared matrix, §5.2).
# python-gates
# runs a stdlib compileall syntax gate (python -m compileall -q src), the
# editable install, the full pytest suite and the zero-runtime-dependency
# policy (pyproject.toml dependencies = [] + pip check) on a 3-version
# matrix (3.12.x / 3.13.x / 3.14.x, fail-fast: false); python-conformance
# runs the Python runner over the 18 shared suites / 519 cases (the
# aggregate digest cfd6e296…, the 18/519 inventory and the per-suite counts
# are pinned inside python/src/consema/conformance/runner.py and asserted by
# python/tests/conformance/test_runner.py, §2.2/§4.2) and
# the runner CLI smoke (python -m consema.conformance, a4dac2d) runs
# with python-conformance; the §3.6/§7.2 shared-conformance step — the
# fourth differential leg (scripts/python-verify-shared-conformance.ps1)
# — is not landed in this repo: the py repo carries no shared-conformance
# carrier; python-package runs the L5
# packaging gate (pip wheel --no-deps — the hatchling-built wheel must
# contain the consema package, §1.1 package row / §5.3 L5 row);
# python-differential runs the bidirectional scripts/python-verify-*.ps1
# harnesses against the Rust emitters (byte parity + normalized + protocol
# exchange). The verify scripts are Windows PowerShell 5.1 compatible and
# pass native Windows paths to pytest, so the differential job runs on
# windows-latest. The
# coverage job (pytest-cov over the full suite, --cov-fail-under=60)
# enforces the initial 60% total-coverage threshold, tightened as coverage
# improves. No repository secrets are required.
#
# This repository carries the Python implementation only; four of the eight
# gate jobs use the multi-repo checkout mode: they check out consema/consema
# (the spec repository, whose conformance/vectors + conformance/differential
# case sets, docs/fc-manifest-0.13.0.json and the toml.corpus.cargo-manifest
# fixture conformance/fixtures/toml/Cargo.toml are the single authority)
# beside this repository and copy the conformance data into the workspace
# root (the runner and the differential harnesses resolve conformance/* by
# repository-relative path). The consema checkout is pinned by commit (ref)
# to db821cd — the mother-repo wave-5 close HEAD (2026-08-15;
# the pin carries the cfd6e296 519-case inventory and the fc-manifest
# sha256 af27d599 (the digest hard-pin lives in
# python/src/consema/conformance/runner.py — asserted by
# python/tests/conformance/test_runner.py; the fc-manifest sha256 af27d599
# is asserted inside the provision action) — so the provisioned data cannot
# drift with the spec repository's default branch. The differential job
# additionally checks out consema/consema-rs (the Rust emitter workspace;
# the python-verify-*.ps1 scripts default to <repo root>\consema-rs) pinned
# to bd5734ea — the commit that vendored the same cfd6e296 519-case
# conformance snapshot — and the scripts build the pinned emitter examples
# (cargo build --locked -p consema-conformance --example …) there. The
# provision step is shared as the ./.github/actions/provision-conformance
# composite action (five call sites — python-gates, coverage,
# python-conformance, python-differential and the release path; one copy).
# The four jobs that do not
# need the conformance data (check-version-consistency, examples,
# python-package, pip-audit) use a single-repo checkout only — no multi-repo
# checkout or provision step is needed there.
name: Python CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

# Top-tier P0: minimal token scope. Every job here only reads repository
# contents (checkout + multi-repo checkouts + running repo scripts); none
# uploads artifacts or writes check runs, so the global minimum suffices.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  python-gates:
    name: python gates (${{ matrix.python-version }}; compileall + pytest + zero-dep)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # '3.12.x' / '3.13.x' / '3.14.x' resolve to the newest patch of
        # each minor line (setup-python); the declared minimum
        # (requires-python >= 3.12.0) is therefore not verified exactly —
        # patch drift is documented, not claimed as verified.
        python-version: ['3.12.x', '3.13.x', '3.14.x']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          path: consema-repo
          ref: db821cdf463d0542fa166d61d7e28cec46812bbc # wave-5 close unified provision pin (db821cd = mother-repo HEAD at the wave-5 close carrying fc-manifest sha256 af27d599)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/provision-conformance
      - name: pip install -e '.[dev]' (editable install + pytest)
        working-directory: python
        run: python -m pip install -e '.[dev]'
      # Static syntax gate (stdlib, zero new dependencies): compileall
      # verifies every module under src/ parses cleanly before pytest.
      - name: compileall syntax gate (python -m compileall -q src)
        working-directory: python
        run: python -m compileall -q src
      # Full suite via --import-mode=importlib: several test files share
      # basenames across directories (tests/document/test_formation.py vs
      # tests/hcl/test_formation.py, …), which breaks pytest's default
      # prepend import mode on a clean checkout (import file mismatch);
      # importlib mode imports each module under a unique name. The xml
      # tests import their conftest as a module (`from conftest import …`),
      # so tests/xml is put on PYTHONPATH (the only directory using that
      # pattern). Differential tests without their golden env vars report
      # documented skips.
      - name: pytest (full test suite, importlib mode, documented-skip upper bound)
        working-directory: python
        env:
          PYTHONPATH: tests/xml
        shell: bash
        run: |
          set -euo pipefail
          output="$(python -m pytest --import-mode=importlib)"
          printf '%s\n' "$output"
          # Documented-skip upper bound (wave-5, ts/kt precedent — "a new
          # silent skip must be reviewed, not shipped"): with the provisioned
          # data and no CONSEMA_DIFFERENTIAL_* env vars, exactly the four
          # env-gated differential tests skip (test_differential_byte_parity /
          # test_forward_differential / test_emit_python_normalized_results_env /
          # test_protocol_exchange); the other five differential tests run
          # against the provisioned data. A new silent skip (fixture-missing
          # skipIf, a new unconditionally skipped test) must not grow the
          # skip set.
          skipped="$(printf '%s\n' "$output" | grep -oE '[0-9]+ skipped' | tail -1 | awk '{print $1}')"
          if [ -z "$skipped" ]; then
            echo "::error::pytest summary line not found — cannot assert the skipped count"
            exit 1
          fi
          if [ "$skipped" -gt 4 ]; then
            echo "::error::pytest skipped count $skipped exceeds the documented upper bound (4 env-gated differential tests) — a new silent skip must be reviewed, not shipped"
            exit 1
          fi
      # Zero-runtime-dependency policy (§1.3): the [project].dependencies
      # table must be declared and empty; pip check must be clean. tomllib
      # reads the declared [project] table — a `dependencies = []` key in
      # any other TOML table cannot satisfy the gate (wave-5: the old
      # table-unscoped regex matched any line in the file), and a missing
      # key fails.
      - name: zero-dependency assertion ([project].dependencies = [] + pip check)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import pathlib, sys, tomllib
          project = tomllib.loads(pathlib.Path('python/pyproject.toml').read_text(encoding='utf-8'))['project']
          if project.get('dependencies') != []:
              sys.exit('pyproject.toml [project].dependencies must be declared and empty (zero runtime dependencies policy)')
          PYEOF
          python -m pip check
          echo 'zero runtime dependencies: [project].dependencies = [] and pip check clean'

  # Coverage gate (gate plan §4 M3 standing toolchain; roadmap §18.3
  # "Coverage 不替代语义证明"): pytest-cov (dev extra, pyproject.toml) measures
  # the consema package (editable install) over the full suite;
  # --cov-fail-under=60 fails the job when total coverage drops below 60% —
  # the threshold assertion is built into pytest-cov (initial threshold,
  # tightened as coverage improves). The same importlib-mode invocation and
  # PYTHONPATH as python-gates (shared-basename test files + the tests/xml
  # conftest module pattern), and the same multi-repo checkout + provision
  # steps (the conformance tests need the conformance data).
  coverage:
    name: coverage (pytest --cov=consema, total >= 60%)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          path: consema-repo
          ref: db821cdf463d0542fa166d61d7e28cec46812bbc # wave-5 close unified provision pin (db821cd = mother-repo HEAD at the wave-5 close carrying fc-manifest sha256 af27d599)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.x'
      - uses: ./.github/actions/provision-conformance
      - name: pip install -e '.[dev]' (editable install + pytest + pytest-cov)
        working-directory: python
        run: python -m pip install -e '.[dev]'
      - name: pytest --cov=consema with fail-under threshold (>= 60%)
        working-directory: python
        env:
          PYTHONPATH: tests/xml
        run: python -m pytest --import-mode=importlib --cov=consema --cov-report=term --cov-fail-under=60

  python-conformance:
    name: python conformance runner (18 suites / 519 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          path: consema-repo
          ref: db821cdf463d0542fa166d61d7e28cec46812bbc # wave-5 close unified provision pin (db821cd = mother-repo HEAD at the wave-5 close carrying fc-manifest sha256 af27d599)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.x'
      - uses: ./.github/actions/provision-conformance
      - name: pip install -e '.[dev]' (editable install + pytest)
        working-directory: python
        run: python -m pip install -e '.[dev]'
      # The runner test (python/tests/conformance/test_runner.py) verifies
      # the aggregate digest
      # cfd6e296da5b22b62d37b076d35bf6bbf58b0678ceddb37eea51a8b47200ab6a
      # (fc-manifest-0.13.0.json digests.conformance_suite.aggregate_sha256
      # — field-name anchor; the file is provisioned, its line numbers are
      # not stable), the 18 suites / 519 cases inventory, the per-suite
      # counts, and a fully conformant run with zero failures AND zero skips
      # (the per-suite (N, 0, 0) hard pins — any skip is a failure) — the
      # §4.2 hard pins live in the runner.
      - name: run the conformance runner (pytest tests/conformance/)
        working-directory: python
        run: python -m pytest tests/conformance/
      # Runner CLI smoke test (python -m consema.conformance): the CLI entry
      # shipped with a4dac2d must actually run in CI — 18 suites / 519
      # cases, exit 0. Wave-4 R54: the summary is asserted (not just the
      # exit code) and --quiet is never used, so a broken entry that exits
      # 0 without running the runner fails the gate.
      - name: runner CLI smoke (python -m consema.conformance, summary asserted)
        working-directory: python
        shell: bash
        run: |
          set -euo pipefail
          output="$(python -m consema.conformance)"
          grep -q "conformant" <<<"$output"
          grep -q "^total: 519 passed, 0 skipped, 0 failed" <<<"$output"

  python-differential:
    name: python differential vs Rust (byte parity + normalized + protocol exchange)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema-rs
          path: consema-rs
          ref: bd5734eab969fa7c8a1a1564d4ee50b85f3d10d6 # cfd6e296 519-case vendored conformance + emitter pin
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          path: consema-repo
          ref: db821cdf463d0542fa166d61d7e28cec46812bbc # wave-5 close unified provision pin (db821cd = mother-repo HEAD at the wave-5 close carrying fc-manifest sha256 af27d599)
      # G70 (adversarial audit, 2026-08-14): the Rust emitter toolchain is
      # pinned to 1.97.1 — the version this harness was locally verified
      # with (钉定本机实测版本), so the differential goldens are
      # bit-reproducible (位级可复现) and independent of the runner's
      # current stable.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: consema-rs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.x'
      - uses: ./.github/actions/provision-conformance
      - name: pip install -e '.[dev]' (pytest for the differential tests)
        shell: pwsh
        working-directory: python
        run: python -m pip install -e '.[dev]'
      # Each script builds the pinned Rust emitter inside the consema-rs
      # checkout (cargo build --locked -p consema-conformance --example …;
      # the scripts default to <repo root>\consema-rs), provisions the
      # golden/evidence directories, runs the Python side with the golden
      # env vars set, closes the reverse direction, and asserts the tests
      # RAN (not skipped).
      - name: scripts/python-verify-byte-parity.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/python-verify-byte-parity.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: scripts/python-verify-normalized-differential.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/python-verify-normalized-differential.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: scripts/python-verify-protocol-exchange.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/python-verify-protocol-exchange.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Dependency audit (pip-audit), the standing security gate in the
  # aggregate check (rs ci.yml shape; G135, 2026-08-13). Identical to the
  # audit.yml pip-audit job, which separates the daily cron from the main CI
  # so the aggregate check's needs can name a job in the same workflow.
  # Wave-4 R14 (2026-08-15): the audit target is narrowed to the declared
  # surface — the job generates a requirements file from the pyproject
  # `dependencies` + `dev` extra declarations and runs `pip-audit -r`, so
  # the audit covers exactly what the repository declares (the direct pins
  # and their transitive closure) against the live OSV advisory database,
  # never the runner-image preinstalls or the pip-audit toolchain. The
  # pip-audit scanner itself is installed at a version-tag pin
  # (pip-audit==2.10.1) fetched from PyPI at run time WITHOUT an in-repo
  # sha256 checksum (wave-5 disclosure, mirroring the consema-go
  # govulncheck@v1.6.0 disclosure in audit.yml: the scanner bytes are
  # outside the declared-surface audit; their integrity relies on the PyPI
  # distribution chain — SECURITY.md 依赖门禁段如实披露). The job
  # is unconditional (no `if:`) so it can never be skipped — a skipped job
  # in the aggregate would fail the alls-green gate (the ts allowed-skips
  # disposition: unconditional jobs need no skip allowance).
  pip-audit:
    name: pip-audit (OSV advisory DB, declared surface)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.x'
      - name: pip install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: generate declared-surface requirements (pyproject dependencies + dev extra)
        working-directory: python
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import pathlib
          import tomllib
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          requirements = list(project['project'].get('dependencies', []))
          requirements.extend(project['project']['optional-dependencies']['dev'])
          pathlib.Path('audit-requirements.txt').write_text('\n'.join(requirements) + '\n', encoding='utf-8')
          PYEOF
          cat audit-requirements.txt
      - name: pip-audit (declared surface only — pyproject dependencies + dev extra, pip-audit -r)
        working-directory: python
        run: pip-audit -r audit-requirements.txt

  # Version-consistency gate (tokio check-readme pattern): the gate asserts
  # FOUR sync points against the python/pyproject.toml version — (1) the
  # README "Version:" line, (2) python/src/consema/__init__.py
  # __version__, (3) the .github/ISSUE_TEMPLATE/bug_report.yml version
  # literal (G73), and (4) the build-consumed license copy (P0 2026-08-14):
  # the hatchling build ships python/LICENSE into the sdist and wheel
  # (G95), so python/LICENSE must stay byte-identical to the
  # repository-root LICENSE. A version bump that forgets any of them fails
  # CI (wave-4 GW4-09: the job name/header previously described only the
  # README line). The assertions live in ONE shared script
  # (scripts/check-version-consistency.sh) executed here and on the release
  # path (release.yml, wave-5) — the release previously never re-ran the
  # gate's non-pyproject sync points. The version source is read with
  # tomllib from the [project] table (wave-5: scope-anchored, replacing the
  # table-unscoped `grep -m1 '^version'` first-match extraction).
  check-version-consistency:
    name: check version consistency (README Version / pyproject.toml / __init__.__version__ / bug_report.yml / LICENSE)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: run the shared version-consistency gate (scripts/check-version-consistency.sh)
        shell: bash
        run: bash scripts/check-version-consistency.sh

  # SDK examples gate: python/examples/sdk_chain.py is the committed
  # five-language SDK chain example (parse -> native query -> best-exact
  # projection -> semantic edit -> canonical materialization -> TOML
  # conversion; language-neutral contract reference: consema repository
  # https://github.com/consema/consema/blob/main/docs/cookbook.md). python/examples/quickstart.py
  # is the committed copy of the root README quick-start fence (wave-4 R6,
  # 2026-08-15: kt-style fence gate — the README ```python fence is
  # compared byte-for-byte against the copy, replacing the pre-gate state
  # where the fence had no committed twin and no CI step executed or
  # compared it, so the "粘贴版与入库版必须保持一致" claim is now
  # enforced, not asserted). Both must actually run and exit 0 with the
  # package importable via PYTHONPATH=src (the gates job pattern). The
  # examples are pure SDK chains (no conformance data), so no multi-repo
  # checkout or provision step is needed.
  examples:
    name: examples (fence gate + sdk_chain + quickstart)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.x'
      # Knit-style doc-example gate (wave-4 R6, 2026-08-15; mirrors the
      # consema-kt ci-kotlin.yml fence step): the README ```python
      # quick-start fence must equal the committed
      # python/examples/quickstart.py body — byte-for-byte content equality
      # after CRLF normalization, with exactly ONE tolerated difference:
      # the file's final newline (the fence body never carries it — the
      # regex consumes the newline before the closing ```). Wave-5: the
      # previous gate .Trim()ed both sides, so interior leading/trailing
      # blank-line drift of the fence body (e.g. an extra blank line before
      # the closing ```) passed undetected and the "byte-for-byte" claim
      # was stronger than the gate; now any interior whitespace or
      # blank-line drift fails. The fence is located by content, not by
      # position — every ```python fence in the README is compared against
      # the file body and exactly one must match, so a new fence inserted
      # earlier can never silently switch the comparison target.
      - name: README quick-start fence must match python/examples/quickstart.py
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $readme = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'README.md') -Raw
          $file = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'python/examples/quickstart.py') -Raw
          $fileN = $file -replace "`r", ''
          if ($fileN -match "`n$") {
            $fileN = $fileN.Substring(0, $fileN.Length - 1) # strip exactly one final LF
          }
          $matches = @()
          foreach ($m in [regex]::Matches($readme, '(?s)```python\r?\n(.*?)\r?\n```')) {
            $fence = $m.Groups[1].Value -replace "`r", ''
            if ($fence -eq $fileN) {
              $matches += $fence
            }
          }
          if ($matches.Count -ne 1) {
            throw "README.md must contain exactly one ```python fence equal to python/examples/quickstart.py (CRLF-normalized, file final newline excepted) — found $($matches.Count) matching fence(s)"
          }
          Write-Output 'README quick-start fence matches python/examples/quickstart.py byte-for-byte (CRLF-normalized, located by content)'
      # SDK chain and quickstart must actually run AND produce their
      # expected output (wave-5: exit-code-only assertions could pass a
      # silently shortened example — the same discipline as the
      # python-conformance summary assertion, R54).
      - name: python examples/sdk_chain.py (must exit 0, output asserted)
        working-directory: python
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          output="$(python examples/sdk_chain.py)"
          grep -q "parse: profile=json.strict status=Complete" <<<"$output"
          grep -q "convert to toml.canonical-document" <<<"$output"
      - name: python examples/quickstart.py (committed quick-start, must exit 0, output asserted)
        working-directory: python
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          output="$(python examples/quickstart.py)"
          test "$output" = '{"a":1,"b":{"c":42}}'

  # L5 packaging gate (five-language-ci-design.md §1.1 package row / §5.3
  # L5 row): `pip wheel --no-deps .` builds the wheel through the hatchling
  # backend (pyproject.toml [build-system] — the `requires`/`build-backend`
  # fields are the anchor) and the wheel must actually contain the consema
  # package (src/consema → wheel root consema/). Nothing is published here
  # and no repository secrets are used; no conformance data is needed
  # (packaging is data-independent).
  python-package:
    name: python package (pip wheel --no-deps, wheel built)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.x'
      - name: pip wheel --no-deps . (hatchling backend, wheel must build)
        working-directory: python
        run: python -m pip wheel --no-deps . -w dist
      - name: verify wheel contains the consema package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'python\dist'
          $wheel = Get-ChildItem -LiteralPath $dist -Filter 'consema-*.whl' | Select-Object -First 1
          if (-not $wheel) {
            throw 'no wheel produced by pip wheel --no-deps .'
          }
          $listing = python -m zipfile -l $wheel.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "zipfile listing failed (exit $LASTEXITCODE)"
          }
          # -match on the listing array returns the matching lines (the
          # zipfile -l table header lines must not count as a match). The
          # marker-file check alone could pass a truncated wheel, so the
          # gate also asserts the implementation modules that must be
          # present (core, document, json and the conformance runner).
          $required = @(
            'consema/__init__',
            'consema/core/value.py',
            'consema/document/limits.py',
            'consema/json/parser.py',
            'consema/conformance/runner.py',
            'consema/conformance/__main__.py',
            'consema/conformance/suites/toml_v1.py',
            'consema/conformance/suites/yaml_v1.py'
          )
          foreach ($entry in $required) {
            if (-not ($listing -match [regex]::Escape($entry))) {
              throw "wheel must contain $entry (src/consema → consema/)"
            }
          }
          Write-Output "wheel verified: $($wheel.Name) ($($wheel.Length) bytes), contains the consema package and implementation modules"

  # Alls-green aggregate gate (tokio/pydantic pattern): `check (all gates
  # green)` is the SINGLE required check for branch protection on this
  # repository; every other job stays non-required. `if: always()` is
  # mandatory — otherwise GitHub skips this job when a dependency fails and
  # a skipped check can be treated as success. `jobs: ${{ toJSON(needs) }}`
  # is the action's mandatory input (it does not read the needs context
  # automatically). No job here uses continue-on-error, so the
  # allowed-failures list is empty.
  check:
    name: check (all gates green)
    if: always()
    needs: [python-gates, python-conformance, python-differential, coverage, pip-audit, check-version-consistency, examples, python-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          allowed-failures: ''
          jobs: ${{ toJSON(needs) }}
