# Consema Python CI (https://github.com/consema/consema/blob/main/docs/five-language-ci-design.md §1.2, §7.1): the
# Python implementation joins the release gate with nine explicit jobs
# (python-gates / python-conformance / python-differential / coverage /
# check-version-consistency / examples / python-package / pip-audit + the
# aggregate check; the design rejects a single shared matrix, §5.2).
# python-gates
# runs a stdlib compileall syntax gate (python -m compileall -q src), the
# editable install, the full pytest suite and the zero-runtime-dependency
# policy (pyproject.toml dependencies = [] + pip check) on a 3-version
# matrix (3.12.x / 3.13.x / 3.14.x, fail-fast: false); python-conformance
# runs the Python runner over the 18 shared suites / 519 cases (the
# aggregate digest cfd6e296…, the 18/519 inventory and the per-suite counts
# are pinned inside python/tests/conformance/test_runner.py, §2.2/§4.2) and
# the runner CLI smoke (python -m consema.conformance, a4dac2d) runs
# with python-conformance; the §3.6/§7.2 shared-conformance step — the
# fourth differential leg (scripts/python-verify-shared-conformance.ps1)
# — is not landed in this repo: the py repo carries no shared-conformance
# carrier; python-package runs the L5
# packaging gate (pip wheel --no-deps — the hatchling-built wheel must
# contain the consema package, §1.1 package row / §5.3 L5 row);
# python-differential runs the bidirectional scripts/python-verify-*.ps1
# harnesses against the Rust emitters (byte parity + normalized + protocol
# exchange). The verify scripts are Windows PowerShell 5.1 compatible and
# pass native Windows paths to pytest, so the differential job runs on
# windows-latest. The
# coverage job (pytest-cov over the full suite, --cov-fail-under=60)
# enforces the initial 60% total-coverage threshold, tightened as coverage
# improves. No repository secrets are required.
#
# This repository carries the Python implementation only; four of the eight
# gate jobs use the multi-repo checkout mode: they check out consema/consema
# (the spec repository, whose conformance/vectors + conformance/differential
# case sets, docs/fc-manifest-0.13.0.json and the toml.corpus.cargo-manifest
# fixture conformance/fixtures/toml/Cargo.toml are the single authority)
# beside this repository and copy the conformance data into the workspace
# root (the runner and the differential harnesses resolve conformance/* by
# repository-relative path). The consema checkout is pinned by commit (ref)
# to 096e5f8 — the 2026-08-14 adversarial wave-2 fix commit that carries
# the cfd6e296 519-case inventory (the digest hard-pin lives in
# python/tests/conformance/test_runner.py) — so the provisioned data cannot
# drift with the spec repository's default branch. The differential job
# additionally checks out consema/consema-rs (the Rust emitter workspace;
# the python-verify-*.ps1 scripts default to <repo root>\consema-rs) pinned
# to bd5734ea — the commit that vendored the same cfd6e296 519-case
# conformance snapshot — and the scripts build the pinned emitter examples
# (cargo build --locked -p consema-conformance --example …) there. The
# provision step is shared as the ./.github/actions/provision-conformance
# composite action (four call sites; one copy). The four jobs that do not
# need the conformance data (check-version-consistency, examples,
# python-package, pip-audit) use a single-repo checkout only — no multi-repo
# checkout or provision step is needed there.
name: Python CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

# Top-tier P0: minimal token scope. Every job here only reads repository
# contents (checkout + multi-repo checkouts + running repo scripts); none
# uploads artifacts or writes check runs, so the global minimum suffices.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  python-gates:
    name: python gates (${{ matrix.python-version }}; compileall + pytest + zero-dep)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # '3.12.x' / '3.13.x' / '3.14.x' resolve to the newest patch of
        # each minor line (setup-python); the declared minimum
        # (requires-python >= 3.12.0) is therefore not verified exactly —
        # patch drift is documented, not claimed as verified.
        python-version: ['3.12.x', '3.13.x', '3.14.x']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          path: consema-repo
          ref: 096e5f840ecc714912db779706fd881405b92308 # cfd6e296 519-case conformance data pin
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/provision-conformance
      - name: pip install -e '.[dev]' (editable install + pytest)
        working-directory: python
        run: python -m pip install -e '.[dev]'
      # Static syntax gate (stdlib, zero new dependencies): compileall
      # verifies every module under src/ parses cleanly before pytest.
      - name: compileall syntax gate (python -m compileall -q src)
        working-directory: python
        run: python -m compileall -q src
      # Full suite via --import-mode=importlib: several test files share
      # basenames across directories (tests/document/test_formation.py vs
      # tests/hcl/test_formation.py, …), which breaks pytest's default
      # prepend import mode on a clean checkout (import file mismatch);
      # importlib mode imports each module under a unique name. The xml
      # tests import their conftest as a module (`from conftest import …`),
      # so tests/xml is put on PYTHONPATH (the only directory using that
      # pattern). Differential tests without their golden env vars report
      # documented skips.
      - name: pytest (full test suite, importlib mode)
        working-directory: python
        env:
          PYTHONPATH: tests/xml
        run: python -m pytest --import-mode=importlib
      # Zero-runtime-dependency policy (§1.3): pyproject.toml:35 declares
      # dependencies = [] and pip check must be clean.
      - name: zero-dependency assertion (dependencies = [] + pip check)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pyproject = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'python\pyproject.toml') -Raw
          if ($pyproject -notmatch '(?m)^dependencies\s*=\s*\[\s*\]\s*$') {
            throw 'pyproject.toml must declare dependencies = [] (zero runtime dependencies policy)'
          }
          python -m pip check
          if ($LASTEXITCODE -ne 0) {
            throw "pip check failed (exit $LASTEXITCODE)"
          }
          Write-Output 'zero runtime dependencies: pyproject.toml dependencies = [] and pip check clean'

  # Coverage gate (gate plan §4 M3 standing toolchain; roadmap §18.3
  # "Coverage 不替代语义证明"): pytest-cov (dev extra, pyproject.toml) measures
  # the consema package (editable install) over the full suite;
  # --cov-fail-under=60 fails the job when total coverage drops below 60% —
  # the threshold assertion is built into pytest-cov (initial threshold,
  # tightened as coverage improves). The same importlib-mode invocation and
  # PYTHONPATH as python-gates (shared-basename test files + the tests/xml
  # conftest module pattern), and the same multi-repo checkout + provision
  # steps (the conformance tests need the conformance data).
  coverage:
    name: coverage (pytest --cov=consema, total >= 60%)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          path: consema-repo
          ref: 096e5f840ecc714912db779706fd881405b92308 # cfd6e296 519-case conformance data pin
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.x'
      - uses: ./.github/actions/provision-conformance
      - name: pip install -e '.[dev]' (editable install + pytest + pytest-cov)
        working-directory: python
        run: python -m pip install -e '.[dev]'
      - name: pytest --cov=consema with fail-under threshold (>= 60%)
        working-directory: python
        env:
          PYTHONPATH: tests/xml
        run: python -m pytest --import-mode=importlib --cov=consema --cov-report=term --cov-fail-under=60

  python-conformance:
    name: python conformance runner (18 suites / 519 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          path: consema-repo
          ref: 096e5f840ecc714912db779706fd881405b92308 # cfd6e296 519-case conformance data pin
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.x'
      - uses: ./.github/actions/provision-conformance
      - name: pip install -e '.[dev]' (editable install + pytest)
        working-directory: python
        run: python -m pip install -e '.[dev]'
      # The runner test (python/tests/conformance/test_runner.py) verifies
      # the aggregate digest
      # cfd6e296da5b22b62d37b076d35bf6bbf58b0678ceddb37eea51a8b47200ab6a
      # (fc-manifest-0.13.0.json:39), the 18 suites / 519 cases inventory,
      # the per-suite counts, and a fully conformant run with zero failures
      # AND zero skips (the per-suite (N, 0, 0) hard pins — any skip is a
      # failure) — the §4.2 hard pins live in the runner.
      - name: run the conformance runner (pytest tests/conformance/)
        working-directory: python
        run: python -m pytest tests/conformance/
      # Runner CLI smoke test (python -m consema.conformance): the CLI entry
      # shipped with a4dac2d must actually run in CI — 18 suites / 519
      # cases, exit 0 (the canonical entry imports the runner once).
      - name: runner CLI smoke (python -m consema.conformance, exit 0)
        working-directory: python
        run: python -m consema.conformance --quiet

  python-differential:
    name: python differential vs Rust (byte parity + normalized + protocol exchange)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema-rs
          path: consema-rs
          ref: bd5734eab969fa7c8a1a1564d4ee50b85f3d10d6 # cfd6e296 519-case vendored conformance + emitter pin
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          path: consema-repo
          ref: 096e5f840ecc714912db779706fd881405b92308 # cfd6e296 519-case conformance data pin
      # G70 (adversarial audit, 2026-08-14): the Rust emitter toolchain is
      # pinned to 1.97.1 — the version this harness was locally verified
      # with (钉定本机实测版本), so the differential goldens are
      # bit-reproducible (位级可复现) and independent of the runner's
      # current stable.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: consema-rs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.x'
      - uses: ./.github/actions/provision-conformance
      - name: pip install -e '.[dev]' (pytest for the differential tests)
        shell: pwsh
        working-directory: python
        run: python -m pip install -e '.[dev]'
      # Each script builds the pinned Rust emitter inside the consema-rs
      # checkout (cargo build --locked -p consema-conformance --example …;
      # the scripts default to <repo root>\consema-rs), provisions the
      # golden/evidence directories, runs the Python side with the golden
      # env vars set, closes the reverse direction, and asserts the tests
      # RAN (not skipped).
      - name: scripts/python-verify-byte-parity.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/python-verify-byte-parity.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: scripts/python-verify-normalized-differential.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/python-verify-normalized-differential.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: scripts/python-verify-protocol-exchange.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/python-verify-protocol-exchange.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Dependency audit (pip-audit), the standing security gate in the
  # aggregate check (rs ci.yml shape; G135, 2026-08-13). Identical to the
  # audit.yml pip-audit job, which separates the daily cron from the main CI
  # so the aggregate check's needs can name a job in the same workflow. The
  # audit target is the installed development
  # environment: after `pip install -e '.[dev]'`, `pip-audit` audits every
  # installed package (the dev extra + its transitive tree) against the
  # live OSV advisory database. The job is unconditional (no `if:`) so it
  # can never be skipped — a skipped job in the aggregate would fail the
  # alls-green gate (the ts allowed-skips disposition: unconditional jobs
  # need no skip allowance).
  pip-audit:
    name: pip-audit (OSV advisory DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.x'
      - name: pip install -e '.[dev]' (dev extra — the whole dependency surface)
        working-directory: python
        run: python -m pip install -e '.[dev]'
      - name: pip install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: pip-audit (environment audit — dev extra + transitive tree)
        working-directory: python
        run: pip-audit

  # Version-consistency gate (tokio check-readme pattern): the README
  # "Version:" line must equal the python/pyproject.toml version, so a
  # version bump that forgets the README fails CI. The same sync-gate
  # shape guards the build-consumed license copy (P0 2026-08-14): the
  # hatchling build ships python/LICENSE into the sdist and wheel (G95),
  # so python/LICENSE must stay byte-identical to the repository-root
  # LICENSE.
  check-version-consistency:
    name: check README version vs pyproject.toml (version consistency)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: assert pyproject.toml version == README Version line == __init__ __version__
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' python/pyproject.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "::error::no 'version' found in python/pyproject.toml"
            exit 1
          fi
          # Line-anchored match (not substring): a version bump from
          # 1.0.0-rc.1 to 1.0.0 must not silently pass because the old
          # string is a prefix of the new one — the version must be
          # followed by end-of-line, whitespace or a full-width paren.
          grep -qE "^Version: ${version//./\.}(\s|（|$)" README.md || {
            echo "::error::README.md does not declare the Version line 'Version: $version'"
            exit 1
          }
          grep -qF "__version__ = \"$version\"" python/src/consema/__init__.py || {
            echo "::error::python/src/consema/__init__.py does not declare __version__ = \"$version\""
            exit 1
          }
          # bug_report.yml version literal (G73, 2026-08-14): the template's
          # environment-info line "version（当前 $version）" is a fourth
          # sync location. The closing full-width paren anchors the match,
          # so a bump from 1.0.0-rc.1 to 1.0.0 cannot pass on the old
          # string being a prefix of the new one.
          grep -qF "version（当前 $version）" .github/ISSUE_TEMPLATE/bug_report.yml || {
            echo "::error::.github/ISSUE_TEMPLATE/bug_report.yml does not declare the current version ($version)"
            exit 1
          }
          echo "README and __init__ versions consistent with pyproject.toml: $version"
      # License parity gate (P0, 2026-08-14): python/LICENSE is the file
      # hatchling ships into the sdist and wheel (pyproject.toml
      # [tool.hatch.metadata] license-files); it must never drift from the
      # repository-root LICENSE.
      - name: assert python/LICENSE is byte-identical to the repository-root LICENSE
        shell: bash
        run: |
          set -euo pipefail
          if ! cmp -s LICENSE python/LICENSE; then
            echo "::error::python/LICENSE must be byte-identical to the repository-root LICENSE (the hatchling build ships python/LICENSE into the sdist and wheel)"
            exit 1
          fi
          echo "python/LICENSE byte-identical to the repository-root LICENSE"

  # SDK examples gate: python/examples/sdk_chain.py is the committed
  # five-language SDK chain example (parse -> native query -> best-exact
  # projection -> semantic edit -> canonical materialization -> TOML
  # conversion; language-neutral contract reference: consema repository
  # https://github.com/consema/consema/blob/main/docs/cookbook.md). It must actually run and exit 0 with the package
  # importable via PYTHONPATH=src (the gates job pattern). The example is a
  # pure SDK chain (no conformance data), so no multi-repo checkout or
  # provision step is needed.
  examples:
    name: examples (python examples/sdk_chain.py)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.x'
      - name: python examples/sdk_chain.py (must exit 0)
        working-directory: python
        env:
          PYTHONPATH: src
        run: python examples/sdk_chain.py

  # L5 packaging gate (five-language-ci-design.md §1.1 package row / §5.3
  # L5 row): `pip wheel --no-deps .` builds the wheel through the hatchling
  # backend (pyproject.toml [build-system], python/pyproject.toml:12-14) and
  # the wheel must actually contain the consema package (src/consema → wheel
  # root consema/). Nothing is published here and no repository secrets are
  # used; no conformance data is needed (packaging is data-independent).
  python-package:
    name: python package (pip wheel --no-deps, wheel built)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.x'
      - name: pip wheel --no-deps . (hatchling backend, wheel must build)
        working-directory: python
        run: python -m pip wheel --no-deps . -w dist
      - name: verify wheel contains the consema package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'python\dist'
          $wheel = Get-ChildItem -LiteralPath $dist -Filter 'consema-*.whl' | Select-Object -First 1
          if (-not $wheel) {
            throw 'no wheel produced by pip wheel --no-deps .'
          }
          $listing = python -m zipfile -l $wheel.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "zipfile listing failed (exit $LASTEXITCODE)"
          }
          # -match on the listing array returns the matching lines (the
          # zipfile -l table header lines must not count as a match). The
          # marker-file check alone could pass a truncated wheel, so the
          # gate also asserts the implementation modules that must be
          # present (core, document, json and the conformance runner).
          $required = @(
            'consema/__init__',
            'consema/core/value.py',
            'consema/document/limits.py',
            'consema/json/parser.py',
            'consema/conformance/runner.py',
            'consema/conformance/__main__.py',
            'consema/conformance/suites/toml_v1.py',
            'consema/conformance/suites/yaml_v1.py'
          )
          foreach ($entry in $required) {
            if (-not ($listing -match [regex]::Escape($entry))) {
              throw "wheel must contain $entry (src/consema → consema/)"
            }
          }
          Write-Output "wheel verified: $($wheel.Name) ($($wheel.Length) bytes), contains the consema package and implementation modules"

  # Alls-green aggregate gate (tokio/pydantic pattern): `check (all gates
  # green)` is the SINGLE required check for branch protection on this
  # repository; every other job stays non-required. `if: always()` is
  # mandatory — otherwise GitHub skips this job when a dependency fails and
  # a skipped check can be treated as success. `jobs: ${{ toJSON(needs) }}`
  # is the action's mandatory input (it does not read the needs context
  # automatically). No job here uses continue-on-error, so the
  # allowed-failures list is empty.
  check:
    name: check (all gates green)
    if: always()
    needs: [python-gates, python-conformance, python-differential, coverage, pip-audit, check-version-consistency, examples, python-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          allowed-failures: ''
          jobs: ${{ toJSON(needs) }}
