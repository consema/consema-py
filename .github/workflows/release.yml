# Consema Python release: tag-triggered PyPI publish of the `consema`
# package (top-tier bar: 半自动发布, pydantic precedent).
#
# Credentials — PyPI trusted publishing (OIDC), the standard PyPI pattern:
# no passwords or tokens in GitHub; the pypa/gh-action-pypi-publish action
# exchanges the GitHub OIDC token (id-token: write) for a short-lived PyPI
# upload token. User-side one-time setup per package (see RELEASING.md §2):
# PyPI → project settings → Publishing → "Add a new publisher" with
#   - publisher: GitHub
#   - owner: consema
#   - repository: consema-py
#   - workflow file: release.yml
# (PyPI's trusted publishing works for the first release too, unlike
# crates.io — no manual first upload is required.)
name: Release to PyPI

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: build wheel+sdist and publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.x'
      # Release guard (G106 extension, 2026-08-13): the tag must point at
      # origin/main HEAD — a tag pushed from a stale or divergent commit
      # must not publish old code (same gate as the consema-go/consema-rs
      # release.yml verify steps).
      - name: verify tag points at main HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not point at origin/main HEAD"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME points at origin/main HEAD"
      # Release guard (rc 前六角色审计 P1, 2026-08-12): the tag minus the
      # leading v must equal the pyproject.toml version, otherwise a
      # mismatched tag could publish the wrong version to PyPI.
      - name: verify tag matches manifest version (pyproject.toml)
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(python -c "import tomllib; print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")"
          tag="${GITHUB_REF_NAME#v}"
          if [[ -z "$manifest" ]]; then
            echo "::error::could not read version from python/pyproject.toml"
            exit 1
          fi
          if [[ "$tag" != "$manifest" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $manifest"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches pyproject.toml version $manifest"
      # Release-path test gate (adversarial audit G106): the publish path
      # must not ship untested code. The full suite needs provisioned
      # conformance data (multi-repo checkout), so the release path runs
      # the data-independent gates: compileall syntax gate, the
      # zero-dependency assertion and the SDK chain example.
      - name: pip install -e '.[dev]' (pytest for the release-path gates)
        working-directory: python
        run: python -m pip install -e '.[dev]'
      - name: compileall syntax gate (python -m compileall -q src)
        working-directory: python
        run: python -m compileall -q src
      - name: zero-dependency assertion (dependencies = [] + pip check)
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^dependencies = \[\]$' python/pyproject.toml; then
            echo "::error::pyproject.toml must declare dependencies = [] (zero runtime dependencies policy)"
            exit 1
          fi
          python -m pip check
      - name: SDK chain example (python examples/sdk_chain.py must exit 0)
        working-directory: python
        env:
          PYTHONPATH: src
        run: python examples/sdk_chain.py
      - name: build wheel + sdist (python -m build, hatchling backend)
        working-directory: python
        run: |
          python -m pip install build==1.5.0
          python -m build
      # Artifact verification (adversarial audit G106): assert the wheel
      # really contains the package and its implementation modules before
      # anything reaches PyPI.
      - name: verify built wheel + sdist contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'python\dist'
          $wheel = Get-ChildItem -LiteralPath $dist -Filter 'consema-*.whl' | Select-Object -First 1
          $sdist = Get-ChildItem -LiteralPath $dist -Filter 'consema-*.tar.gz' | Select-Object -First 1
          if (-not $wheel) { throw 'no wheel produced by python -m build' }
          if (-not $sdist) { throw 'no sdist produced by python -m build' }
          $listing = python -m zipfile -l $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw "zipfile listing failed (exit $LASTEXITCODE)" }
          foreach ($entry in @('consema/__init__', 'consema/core/value.py', 'consema/conformance/runner.py')) {
            if (-not ($listing -match [regex]::Escape($entry))) {
              throw "wheel must contain $entry (src/consema → consema/)"
            }
          }
          Write-Output "release artifacts verified: $($wheel.Name) ($($wheel.Length) bytes) + $($sdist.Name)"
      - name: publish to PyPI (trusted publishing, OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (v1.14.2)
        with:
          packages-dir: python/dist
