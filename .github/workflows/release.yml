# Consema Python release: tag-triggered PyPI publish of the `consema`
# package (top-tier bar: 半自动发布, pydantic precedent).
#
# Credentials — PyPI trusted publishing (OIDC), the standard PyPI pattern:
# no passwords or tokens in GitHub; the pypa/gh-action-pypi-publish action
# exchanges the GitHub OIDC token (id-token: write) for a short-lived PyPI
# upload token. User-side one-time setup per package (see RELEASING.md §2):
# PyPI → project settings → Publishing → "Add a new publisher" with
#   - publisher: GitHub
#   - owner: consema
#   - repository: consema-py
#   - workflow file: release.yml
# (PyPI's trusted publishing works for the first release too, unlike
# crates.io — no manual first upload is required.)
name: Release to PyPI

on:
  push:
    tags: ['v*']

# G122 (adversarial audit, 2026-08-14): one release run per tag — a re-push
# or continued run while the previous run is still going would start a
# second concurrent publish (mirrors the consema-rs release.yml shape).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: build wheel+sdist and publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.x'
      # Release guard (G106 extension, 2026-08-13; G71 race fix,
      # 2026-08-14; wave-4 R7 peel, 2026-08-15): the tag must point at a
      # commit on origin/main — a tag pushed from a stale or divergent
      # commit must not publish old code. The workflow runs after the push,
      # when origin/main may already have advanced past the tag's commit, so
      # a realtime HEAD comparison would fail a legitimately pushed tag; the
      # push-time snapshot is not available, and ancestry is used instead:
      # the tag commit must lie on origin/main's history (the merge-base
      # ancestry shape mirrors the consema-go/consema-rs release guards; the
      # go/rs guards additionally enforce a 24 h tag-recency window — go
      # release.yml / rs release.yml — which this guard deliberately omits;
      # wave-5 2026-08-15: the previous "same gate shape" comment was
      # stronger than the implementations). GITHUB_SHA
      # for an annotated tag push is the tag object, so the ^{commit} peel
      # makes the check work for both lightweight and annotated tags.
      - name: verify tag points at a commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" FETCH_HEAD; then
            echo "::error::tag $GITHUB_REF_NAME does not point at a commit on origin/main"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME points at a commit on origin/main"
      # Release guard (rc 前六角色审计 P1, 2026-08-12): the tag minus the
      # leading v must equal the pyproject.toml version, otherwise a
      # mismatched tag could publish the wrong version to PyPI.
      - name: verify tag matches manifest version (pyproject.toml)
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(python -c "import tomllib; print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")"
          tag="${GITHUB_REF_NAME#v}"
          if [[ -z "$manifest" ]]; then
            echo "::error::could not read version from python/pyproject.toml"
            exit 1
          fi
          if [[ "$tag" != "$manifest" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $manifest"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches pyproject.toml version $manifest"
      # Release-path test gate (adversarial audit G106/G72): the publish
      # path must not ship untested code — the full pytest suite runs with
      # the CI importlib flags (conformance data provisioned from the spec
      # repository, same pin as ci-python.yml), followed by the compileall
      # syntax gate, the zero-dependency assertion and the SDK chain
      # example.
      # Wave-4 R15 disclosure: the three cross-language differential legs
      # (byte parity / normalized differential / protocol exchange) do NOT
      # run with the release — they need the consema-rs (Rust emitter)
      # checkout, which the release workflow does not include, and are only
      # exercised by the python-differential CI job. With the conformance
      # data provisioned below, 5 of the 9 differential tests still run for
      # real on the release path (the three test_case_file_integrity guards
      # plus test_emit_python_normalized_results / test_emit_format_consistency);
      # the 4 env-gated tests skip (documented — the pytest step below
      # asserts the skip upper bound).
      # 差分三腿不随发布运行；发布前按 rc-candidate 检查单本机执行.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          path: consema-repo
          ref: db821cdf463d0542fa166d61d7e28cec46812bbc # wave-5 close unified provision pin (db821cd = mother-repo HEAD at the wave-5 close carrying fc-manifest sha256 af27d599)
      - uses: ./.github/actions/provision-conformance
      - name: pip install -e '.[dev]' (pytest for the release-path gates)
        working-directory: python
        run: python -m pip install -e '.[dev]'
      - name: pytest (full test suite, CI importlib mode, documented-skip upper bound)
        working-directory: python
        env:
          PYTHONPATH: tests/xml
        shell: bash
        run: |
          set -euo pipefail
          output="$(python -m pytest --import-mode=importlib)"
          printf '%s\n' "$output"
          # Documented-skip upper bound (wave-5, same assertion as the
          # ci-python.yml python-gates step): with the provisioned data and
          # no CONSEMA_DIFFERENTIAL_* env vars, exactly the four env-gated
          # differential tests skip (test_differential_byte_parity /
          # test_forward_differential / test_emit_python_normalized_results_env /
          # test_protocol_exchange); the other five differential tests run.
          # A new silent skip must not grow the skip set — on the release
          # path a silent skip would ship with the published artifact.
          skipped="$(printf '%s\n' "$output" | grep -oE '[0-9]+ skipped' | tail -1 | awk '{print $1}')"
          if [ -z "$skipped" ]; then
            echo "::error::pytest summary line not found — cannot assert the skipped count"
            exit 1
          fi
          if [ "$skipped" -gt 4 ]; then
            echo "::error::pytest skipped count $skipped exceeds the documented upper bound (4 env-gated differential tests) — a new silent skip must be reviewed, not shipped"
            exit 1
          fi
      - name: compileall syntax gate (python -m compileall -q src)
        working-directory: python
        run: python -m compileall -q src
      - name: zero-dependency assertion ([project].dependencies = [] + pip check)
        shell: bash
        run: |
          set -euo pipefail
          # Same check as the CI copy (ci-python.yml zero-dependency step),
          # byte-for-byte identical semantics: tomllib reads the declared
          # [project].dependencies table, so a table-unscoped `dependencies
          # = []` elsewhere in the file or a formatting-normalized spelling
          # cannot pass one copy and fail the other (wave-5: the previous
          # grep -E / .NET-regex pair differed in cross-line matching — the
          # CI copy's \s could match newlines, the grep copy could not).
          python - <<'PYEOF'
          import pathlib, sys, tomllib
          project = tomllib.loads(pathlib.Path('python/pyproject.toml').read_text(encoding='utf-8'))['project']
          if project.get('dependencies') != []:
              sys.exit('pyproject.toml [project].dependencies must be declared and empty (zero runtime dependencies policy)')
          PYEOF
          python -m pip check
      # Wave-5: the release path re-runs the shared version-consistency
      # gate (scripts/check-version-consistency.sh — README Version line /
      # pyproject.toml / __init__.__version__ / bug_report.yml literal /
      # python/LICENSE byte parity). The tag↔pyproject step above alone
      # could publish a bump that forgot the other sync points.
      - name: version consistency gate (scripts/check-version-consistency.sh)
        shell: bash
        run: bash scripts/check-version-consistency.sh
      - name: SDK chain example (python examples/sdk_chain.py must exit 0, output asserted)
        working-directory: python
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          output="$(python examples/sdk_chain.py)"
          grep -q "parse: profile=json.strict status=Complete" <<<"$output"
          grep -q "convert to toml.canonical-document" <<<"$output"
      - name: build wheel + sdist (python -m build, hatchling backend)
        working-directory: python
        run: |
          python -m pip install build==1.5.0
          python -m build
      # Artifact verification (adversarial audit G106/G72): assert the
      # wheel really contains the package and its implementation modules
      # (including the conformance suites subpackage) plus the LICENSE text
      # (PEP 639 license-files, dist-info/licenses/LICENSE — G95), and the
      # sdist carries the package tree plus the LICENSE text, before
      # anything reaches PyPI.
      - name: verify built wheel + sdist contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'python\dist'
          $wheel = Get-ChildItem -LiteralPath $dist -Filter 'consema-*.whl' | Select-Object -First 1
          $sdist = Get-ChildItem -LiteralPath $dist -Filter 'consema-*.tar.gz' | Select-Object -First 1
          if (-not $wheel) { throw 'no wheel produced by python -m build' }
          if (-not $sdist) { throw 'no sdist produced by python -m build' }
          $listing = python -m zipfile -l $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw "zipfile listing failed (exit $LASTEXITCODE)" }
          foreach ($entry in @('consema/__init__', 'consema/core/value.py', 'consema/document/limits.py', 'consema/json/parser.py', 'consema/conformance/runner.py', 'consema/conformance/__main__.py', 'consema/conformance/suites/toml_v1.py', 'consema/conformance/suites/yaml_v1.py')) {
            if (-not ($listing -match [regex]::Escape($entry))) {
              throw "wheel must contain $entry (src/consema → consema/)"
            }
          }
          # G95 (2026-08-14): the wheel must carry the MIT LICENSE text
          # (PEP 639 license-files location; the dist-info prefix is
          # version-dependent, so the check matches the stable tail).
          if (-not ($listing -match [regex]::Escape('dist-info/licenses/LICENSE'))) {
            throw 'wheel must carry the LICENSE text (dist-info/licenses/LICENSE)'
          }
          $tarList = tar -tzf $sdist.FullName
          if ($LASTEXITCODE -ne 0) { throw "tar listing failed (exit $LASTEXITCODE)" }
          if (-not ($tarList -match 'consema/conformance/__main__.py')) {
            throw 'sdist must contain the conformance CLI (consema/conformance/__main__.py)'
          }
          if (-not ($tarList -match 'LICENSE')) {
            throw 'sdist must carry the LICENSE text'
          }
          # Wave-4 GW4-18: the sdist must not carry stray files — the
          # hatchling sdist include config (pyproject.toml
          # [tool.hatch.build.targets.sdist]) ships only src/consema + the
          # license/readme/metadata files; tests/, examples/ and local
          # dotfiles (.coverage from a local coverage run) must never leak
          # into the published artifact. (.gitignore is NOT asserted here:
          # hatchling force-includes VCS exclusion files in sdists by
          # design.)
          foreach ($stray in @('/tests/', '/examples/', '/.coverage', '/__pycache__/', '/.pytest_cache/')) {
            if ($tarList -match [regex]::Escape($stray)) {
              throw "sdist must not contain stray path $stray"
            }
          }
          Write-Output "release artifacts verified: $($wheel.Name) ($($wheel.Length) bytes) + $($sdist.Name)"
      - name: publish to PyPI (trusted publishing, OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (v1.14.2)
        with:
          packages-dir: python/dist
