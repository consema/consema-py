# Dependency audit for the Python implementation (pip-audit), aligned with
# the consema-rs audit.yml shape: a standing check (daily cron + every
# push/PR, no path filters — G135, 2026-08-13: the old
# python/pyproject.toml path filter is gone, so branch protection can
# require this workflow).
#
# The package declares ZERO runtime dependencies (pyproject.toml
# `dependencies = []`, §1.3 policy, asserted in ci-python.yml); the
# [project.optional-dependencies] dev extra (pytest, pytest-cov) is the
# entire dependency surface. The repository keeps no lockfile, so the
# straightforward audit target is the installed development environment:
# after `pip install -e '.[dev]'` the step runs `pip-audit` with no
# arguments, which audits every installed package (the dev extra + its
# transitive tree + the tooling that installation pulled in) against the
# OSV advisory database. Any vulnerable package fails this job. The same
# pip-audit job is defined inside ci-python.yml (the rs standing shape —
# a needs entry must name a job in the same workflow), so the aggregate
# `check` gate now includes audit and a red audit blocks merge (G135).
#
# No repository secrets are required.
name: Dependency audit (pip-audit)

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: python-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (OSV advisory DB, daily + every push/PR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.x'
      - name: pip install -e '.[dev]' (dev extra — the whole dependency surface)
        working-directory: python
        run: python -m pip install -e '.[dev]'
      - name: pip install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: pip-audit (environment audit — dev extra + transitive tree)
        working-directory: python
        run: pip-audit
