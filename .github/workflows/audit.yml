# Dependency audit for the Python implementation (pip-audit), aligned with
# the consema-rs audit.yml shape: a standing check (daily cron + every
# push/PR, no path filters — G135, 2026-08-13: the old
# python/pyproject.toml path filter is gone, so branch protection can
# require this workflow).
#
# The package declares ZERO runtime dependencies (pyproject.toml
# `dependencies = []`, §1.3 policy, asserted in ci-python.yml); the
# [project.optional-dependencies] dev extra (pytest, pytest-cov) is the
# entire dependency surface. Wave-4 R14 (2026-08-15): the audit is
# narrowed to the declared surface — the job generates a requirements
# file from the pyproject `dependencies` + `dev` extra declarations and
# runs `pip-audit -r`, so the audit covers exactly what the repository
# declares (the direct pins and their transitive closure) and never the
# runner-image preinstalls or the pip-audit toolchain itself. The same
# pip-audit job is defined inside ci-python.yml (the rs standing shape —
# a needs entry must name a job in the same workflow), so the aggregate
# `check` gate now includes audit and a red audit blocks merge (G135).
#
# No repository secrets are required.
name: Dependency audit (pip-audit)

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: python-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (OSV advisory DB, daily + every push/PR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.x'
      - name: pip install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: generate declared-surface requirements (pyproject dependencies + dev extra)
        working-directory: python
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import pathlib
          import tomllib
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          requirements = list(project['project'].get('dependencies', []))
          requirements.extend(project['project']['optional-dependencies']['dev'])
          pathlib.Path('audit-requirements.txt').write_text('\n'.join(requirements) + '\n', encoding='utf-8')
          PYEOF
          cat audit-requirements.txt
      - name: pip-audit (declared surface only — pyproject dependencies + dev extra, pip-audit -r)
        working-directory: python
        run: pip-audit -r audit-requirements.txt
