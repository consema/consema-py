# Dependency audit for the Python implementation (pip-audit), mirroring the
# consema-rs audit.yml shape (daily cron + push/PR manifest filters).
#
# The package declares ZERO runtime dependencies (pyproject.toml
# `dependencies = []`, §1.3 policy, asserted in ci-python.yml); the
# [project.optional-dependencies] dev extra (pytest, pytest-cov) is the
# entire dependency surface. The repository keeps no lockfile, so the
# straightforward audit target is the installed development environment:
# after `pip install -e '.[dev]'` the step runs `pip-audit` with no
# arguments, which audits every installed package (the dev extra + its
# transitive tree + the tooling that installation pulled in) against the
# OSV advisory database. Any vulnerable package fails the job (failures
# are red; the surface is dev-only, so a strict bar is affordable).
#
# No repository secrets are required.
name: Dependency audit (pip-audit)

on:
  schedule:
    - cron: '37 3 * * *'
  push:
    branches: [main]
    paths:
      - python/pyproject.toml
  pull_request:
    paths:
      - python/pyproject.toml

concurrency:
  group: python-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (OSV advisory DB, daily + manifest push/PR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.x'
      - name: pip install -e '.[dev]' (dev extra — the whole dependency surface)
        working-directory: python
        run: python -m pip install -e '.[dev]'
      - name: pip install pip-audit
        run: python -m pip install pip-audit
      - name: pip-audit (environment audit — dev extra + transitive tree)
        working-directory: python
        run: python -m pip-audit
